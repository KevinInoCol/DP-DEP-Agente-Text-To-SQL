# Parámetros del LLM y de la memoria del agente Text-to-SQL.
# Solo configuración. Sin prompt ni código.

llm:
  provider: openai
  model: gpt-4.1
  temperature: 0        # SQL determinista: no queremos creatividad

memory:
  backend: in_memory    # InMemorySaver de LangGraph. Vive mientras corre el proceso.
