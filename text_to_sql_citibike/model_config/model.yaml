# Parámetros de los LLM y de la memoria. Solo configuración. Sin prompt ni código.

# Agente principal (Text-to-SQL). Lo lee agent.py.
llm:
  provider: openai
  model: gpt-4.1
  temperature: 0        # SQL determinista: no queremos creatividad

# Subagente de gráficos. Lo lee subagents/grafico.py.
# Tarea acotada (elegir tipo de gráfico y columnas) → basta el modelo mini.
llm_grafico:
  provider: openai
  model: gpt-4.1-mini
  temperature: 0

memory:
  backend: in_memory    # InMemorySaver de LangGraph. Vive mientras corre el proceso.
